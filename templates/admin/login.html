{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<section class="gate-card" style="max-width: 420px; margin: 0 auto;">
  <h1>Admin login</h1>

  {% if reason == 'idle' %}
    <p class="flash flash-info">Your admin session timed out. Please sign in again.</p>
  {% endif %}
  {% if error %}
    <p class="flash flash-error">{{ error }}</p>
  {% endif %}

  <form class="stacked" method="post" action="{{ url_for('admin.login_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
